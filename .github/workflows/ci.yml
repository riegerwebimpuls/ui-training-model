name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          channel: stable
          # Cache stays off: the workflow token is contents:read only, and the
          # action's cache step pulls in a floating actions/cache tag.
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Errors fail the job. Warnings and infos do not (both are fatal by
        # default on Flutter 3.44).
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web
